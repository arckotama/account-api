services:
  db:
    image: postgres:18.6-alpine3.24
    container_name: account-api-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      
  migrate:
    image: migrate/migrate:v4.20.1
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    entrypoint:
      - "migrate"
      - "-path"
      - "/migrations"
      - "-database"
      - "postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable"

  api:
    image: golang:1.27.3-alpine3.24
    user: "${HOST_ID:-1000}:${HOST_GID:-1000}"
    working_dir: /app
    command: ["go", "run", "./cmd/api"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOCACHE: /go/cache
      GOFLAGS: "-buildvcs=false"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    ports:
      - "${APP_PORT}:8080"
    volumes:
      - .:/app
      - gopath:/go
volumes:
  pgdata:
  gopath: